<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration | CodeQuest</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="navbar">
        <a href="index.html" class="logo">
            &lt;/&gt; Code<span>Quest</span>
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="student-registration.html">Registration</a>
            <a href="student-login.html">Student Login</a>
            <a href="admin-login.html">Admin Login</a>
            <a href="missions.html">Missions</a>
            <a href="leaderboard.html">Leaderboard</a>
        </nav>
    </header>

    <main>
        <div class="form-container">

            <h2>Student Registration</h2>

            <p style="color: #94a3b8;">
                Create your CodeQuest account and start your coding journey.
            </p>

            <form action="#" method="get">

                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

                <label for="language">Preferred Programming Language</label>
                <select id="language" name="language" required>
                    <option value="">Select a language</option>
                    <option value="python">Python</option>
                    <option value="java">Java</option>
                    <option value="c">C</option>
                    <option value="cpp">C++</option>
                    <option value="javascript">JavaScript</option>
                </select>

                <button type="submit" class="btn primary">
                    Create Account
                </button>

            </form>

            <p style="margin-top: 20px; color: #94a3b8;">
                Already registered?
                <a href="student-login.html"
                   style="color: #22d3ee;">
                    Student Login
                </a>
            </p>

        </div>
    </main>

    <footer>
        <h3>&lt;/&gt; CodeQuest</h3>
        <p>Learn. Code. Compete. Level Up.</p>
    </footer>

</body>
</html>
